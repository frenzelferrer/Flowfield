<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flowfield — a living shader</title>
<meta name="description" content="A real-time WebGL generative aurora that swirls around your pointer. Move to stir, click to pulse.">
<style>
  /* ---- standalone theme tokens ---- */
  :root {
    --font-sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --glass-blur: 5px;
  }
  html[data-theme="dark"] {
    --text-primary: rgba(255, 255, 255, 0.92);
    --text-secondary: rgba(255, 255, 255, 0.62);
    --surface-raised: #26262b;
    --surface-strong: #32323a;
    --border: rgba(255, 255, 255, 0.14);
    --accent: #5b8cff;
    --on-accent: #ffffff;
    --glass-surface: rgba(28, 28, 34, 0.42);
    --glass-border: rgba(255, 255, 255, 0.16);
    --glass-highlight: rgba(255, 255, 255, 0.22);
    --glass-lowlight: rgba(255, 255, 255, 0.05);
  }
  html[data-theme="light"] {
    --text-primary: rgba(20, 20, 24, 0.9);
    --text-secondary: rgba(20, 20, 24, 0.58);
    --surface-raised: #ffffff;
    --surface-strong: #f0f0f4;
    --border: rgba(20, 20, 24, 0.14);
    --accent: #3b6fe0;
    --on-accent: #ffffff;
    --glass-surface: rgba(255, 255, 255, 0.45);
    --glass-border: rgba(255, 255, 255, 0.55);
    --glass-highlight: rgba(255, 255, 255, 0.85);
    --glass-lowlight: rgba(255, 255, 255, 0.15);
  }

  /* ---- glass controls ---- */
  .glass-segmented,
  .glass-icon-button {
    box-sizing: border-box;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface-raised);
    color: var(--text-primary);
  }
  .glass-segmented { display: inline-flex; align-items: center; gap: 2px; padding: 2px; }
  .glass-icon-button {
    min-height: 28px; inline-size: 28px; padding: 5px; aspect-ratio: 1;
    font: inherit; cursor: pointer;
    transition: background-color 140ms ease, border-color 140ms ease, opacity 140ms ease;
  }
  .glass-icon-button:hover { border-color: var(--accent); background: var(--surface-strong); }
  .glass-icon-button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @supports ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
    .glass-segmented,
    .glass-icon-button {
      border-color: var(--glass-border);
      background: var(--glass-surface);
      box-shadow: inset 0 1px 0 var(--glass-highlight), inset 0 -1px 0 var(--glass-lowlight);
      backdrop-filter: blur(var(--glass-blur));
      -webkit-backdrop-filter: blur(var(--glass-blur));
    }
  }

  html, body { margin: 0; padding: 0; }
  body { font-family: var(--font-sans); color: var(--text-primary); background: #0a0a10; }
  html[data-theme="light"] body { background: #f4f5f8; }

  .stage {
    position: relative;
    isolation: isolate;
    block-size: 100svh;
    overflow: hidden;
    touch-action: none;
  }
  #field {
    position: absolute; inset: 0; z-index: 0;
    inline-size: 100%; block-size: 100%; display: block;
  }

  header {
    position: absolute; inset-block-start: 0; inset-inline-start: 0; inset-inline-end: 0;
    z-index: 1; padding: 14px 16px 0; pointer-events: none;
  }
  html[data-theme="dark"] header { text-shadow: 0 1px 10px rgba(0,0,0,.35); }
  h1 { margin: 0; font-size: 15px; font-weight: 600; line-height: 1.2; letter-spacing: 0; }
  .status { margin: 2px 0 0; font-size: 12px; line-height: 1.35; color: var(--text-secondary); }
  .status output { font: inherit; color: inherit; }

  .controls {
    position: absolute; inset-block-end: 14px; inset-inline-start: 16px; z-index: 1;
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  }
  .seg-btn {
    appearance: none; border: 0; background: transparent; color: inherit;
    font: inherit; font-size: 12px; line-height: 1; padding: 6px 10px; border-radius: 6px;
    cursor: pointer; transition: background-color 140ms ease, color 140ms ease;
  }
  .seg-btn[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
  .seg-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .hint { margin: 0; font-size: 12px; color: var(--text-secondary); }
  #pauseBtn svg { display: block; inline-size: 100%; block-size: 100%; }

  .fallback {
    position: absolute; inset: 0; z-index: 2; display: none;
    align-items: center; justify-content: center; padding: 24px; text-align: center;
    background:
      radial-gradient(120% 90% at 20% 10%, rgba(88,80,236,.35), transparent 60%),
      radial-gradient(120% 90% at 85% 90%, rgba(16,185,129,.3), transparent 60%),
      #0a0a10;
    color: rgba(255,255,255,.7);
  }
  .fallback p { margin: 0; font-size: 13px; max-inline-size: 34ch; }

  @media (prefers-reduced-motion: reduce) {
    .glass-icon-button, .seg-btn { transition: none; }
    #pauseBtn { display: none; }
  }
</style>
</head>
<body>
<main>
  <section class="stage" aria-label="Flowfield interactive shader">
    <canvas id="field" role="img"
      aria-label="Animated generative aurora field. Moving the pointer stirs the flow; clicking sends a pulse through it."></canvas>

    <header>
      <h1>Flowfield</h1>
      <p class="status"><output id="stateOut" aria-live="polite">Nebula · Live</output></p>
    </header>

    <div class="controls">
      <div class="glass-segmented" role="group" aria-label="Color mood">
        <button type="button" class="seg-btn" data-mood="0" aria-pressed="true">Nebula</button>
        <button type="button" class="seg-btn" data-mood="1" aria-pressed="false">Ember</button>
        <button type="button" class="seg-btn" data-mood="2" aria-pressed="false">Aurora</button>
      </div>
      <button type="button" id="pauseBtn" class="glass-icon-button" aria-label="Pause animation">
        <svg id="iconPause" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
          <rect x="3.5" y="3" width="3" height="10" rx="1"></rect>
          <rect x="9.5" y="3" width="3" height="10" rx="1"></rect>
        </svg>
        <svg id="iconPlay" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true" style="display:none">
          <path d="M4.5 3.2c0-.8.87-1.3 1.56-.87l7 4.3c.66.4.66 1.34 0 1.74l-7 4.3c-.69.43-1.56-.07-1.56-.87z"></path>
        </svg>
      </button>
      <p class="hint">Move to stir · Click to pulse</p>
    </div>

    <div class="fallback" id="fallback">
      <p>This device could not start WebGL, so the living field is resting. Try a browser with hardware acceleration enabled.</p>
    </div>
  </section>
</main>

<script>
(function () {
  'use strict';

  var stage = document.querySelector('.stage');
  var canvas = document.getElementById('field');
  var stateOut = document.getElementById('stateOut');
  var pauseBtn = document.getElementById('pauseBtn');
  var iconPause = document.getElementById('iconPause');
  var iconPlay = document.getElementById('iconPlay');
  var segBtns = Array.prototype.slice.call(document.querySelectorAll('.seg-btn'));

  var MOODS = ['Nebula', 'Ember', 'Aurora'];
  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var gl = canvas.getContext('webgl', { antialias: false, alpha: false, depth: false, stencil: false, powerPreference: 'low-power' });
  if (!gl) {
    document.getElementById('fallback').style.display = 'flex';
    stateOut.textContent = 'WebGL unavailable';
    return;
  }

  var VERT = [
    'attribute vec2 aPos;',
    'void main(){ gl_Position = vec4(aPos, 0.0, 1.0); }'
  ].join('\n');

  var FRAG = [
    'precision highp float;',
    'uniform vec2 uRes;',
    'uniform float uTime;',
    'uniform vec2 uPointer;',
    'uniform float uEnergy;',
    'uniform float uPulse;',
    'uniform float uMood;',
    'uniform float uLight;',
    '',
    'vec2 hash22(vec2 p){',
    '  vec3 p3 = fract(vec3(p.xyx) * vec3(0.1031, 0.1030, 0.0973));',
    '  p3 += dot(p3, p3.yzx + 33.33);',
    '  return fract((p3.xx + p3.yz) * p3.zy) * 2.0 - 1.0;',
    '}',
    'float noise(vec2 p){',
    '  vec2 i = floor(p); vec2 f = fract(p);',
    '  vec2 u = f * f * (3.0 - 2.0 * f);',
    '  return mix(',
    '    mix(dot(hash22(i), f), dot(hash22(i + vec2(1.0, 0.0)), f - vec2(1.0, 0.0)), u.x),',
    '    mix(dot(hash22(i + vec2(0.0, 1.0)), f - vec2(0.0, 1.0)), dot(hash22(i + vec2(1.0, 1.0)), f - vec2(1.0, 1.0)), u.x),',
    '    u.y);',
    '}',
    'float fbm(vec2 p){',
    '  float v = 0.0; float a = 0.55;',
    '  mat2 m = mat2(1.6, 1.2, -1.2, 1.6);',
    '  for(int i = 0; i < 5; i++){ v += a * noise(p); p = m * p; a *= 0.5; }',
    '  return v;',
    '}',
    'vec3 pal(vec3 deep, vec3 mid, vec3 hi, float x){',
    '  vec3 c = mix(deep, mid, smoothstep(0.05, 0.60, x));',
    '  return mix(c, hi, smoothstep(0.58, 0.98, x));',
    '}',
    'vec3 moodColor(float mood, float x){',
    '  vec3 c0 = pal(vec3(0.012, 0.014, 0.060), vec3(0.230, 0.160, 0.720), vec3(0.620, 0.950, 1.000), x);',
    '  vec3 c1 = pal(vec3(0.070, 0.010, 0.012), vec3(0.750, 0.220, 0.060), vec3(1.000, 0.850, 0.500), x);',
    '  vec3 c2 = pal(vec3(0.004, 0.050, 0.045), vec3(0.040, 0.500, 0.380), vec3(0.550, 0.950, 0.850), x);',
    '  float w0 = clamp(1.0 - abs(mood - 0.0), 0.0, 1.0);',
    '  float w1 = clamp(1.0 - abs(mood - 1.0), 0.0, 1.0);',
    '  float w2 = clamp(1.0 - abs(mood - 2.0), 0.0, 1.0);',
    '  float s = max(w0 + w1 + w2, 0.0001);',
    '  return (c0 * w0 + c1 * w1 + c2 * w2) / s;',
    '}',
    'void main(){',
    '  vec2 uv = (gl_FragCoord.xy - 0.5 * uRes) / min(uRes.x, uRes.y);',
    '  float t = uTime;',
    '',
    '  vec2 dp = uv - uPointer;',
    '  float pd = length(dp) + 0.0001;',
    '  float swirl = exp(-pd * pd * 5.5) * (uEnergy * 0.8 + uPulse * 1.7);',
    '  float ang = swirl * 2.4;',
    '  float ca = cos(ang); float sa = sin(ang);',
    '  vec2 p = uPointer + mat2(ca, -sa, sa, ca) * dp;',
    '',
    '  vec2 q = vec2(fbm(p * 1.35 + vec2(0.0, t * 0.50)), fbm(p * 1.35 + vec2(5.2, t * 0.65)));',
    '  vec2 r = vec2(fbm(p * 1.35 + 2.3 * q + vec2(1.7, 9.2) + t * 0.18),',
    '                fbm(p * 1.35 + 2.3 * q + vec2(8.3, 2.8) - t * 0.15));',
    '  float f = fbm(p * 1.35 + 2.5 * r);',
    '',
    '  float x = clamp(0.5 + 0.9 * f + 0.35 * length(q) - 0.25, 0.0, 1.0);',
    '  x = x * x * (3.0 - 2.0 * x);',
    '  vec3 col = moodColor(uMood, x);',
    '',
    '  col += moodColor(uMood, 0.95) * swirl * 0.35;',
    '  float ring = exp(-abs(pd - (1.0 - uPulse) * 0.9) * 14.0) * uPulse;',
    '  col += moodColor(uMood, 0.90) * ring * 0.6;',
    '',
    '  col *= 1.0 - 0.38 * dot(uv, uv);',
    '  col = mix(col, vec3(0.965, 0.970, 0.985), uLight * pow(1.0 - x, 1.4) * 0.9);',
    '',
    '  gl_FragColor = vec4(col, 1.0);',
    '}'
  ].join('\n');

  function compile(type, src) {
    var sh = gl.createShader(type);
    gl.shaderSource(sh, src);
    gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
      return null;
    }
    return sh;
  }

  var vs = compile(gl.VERTEX_SHADER, VERT);
  var fs = compile(gl.FRAGMENT_SHADER, FRAG);
  if (!vs || !fs) {
    document.getElementById('fallback').style.display = 'flex';
    stateOut.textContent = 'Shader unavailable';
    return;
  }
  var prog = gl.createProgram();
  gl.attachShader(prog, vs);
  gl.attachShader(prog, fs);
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
    document.getElementById('fallback').style.display = 'flex';
    stateOut.textContent = 'Shader unavailable';
    return;
  }
  gl.useProgram(prog);

  var buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  var aPos = gl.getAttribLocation(prog, 'aPos');
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

  var U = {};
  ['uRes', 'uTime', 'uPointer', 'uEnergy', 'uPulse', 'uMood', 'uLight'].forEach(function (n) {
    U[n] = gl.getUniformLocation(prog, n);
  });

  // ---- state ----
  var pointer = { x: 0, y: 0, tx: 0, ty: 0 };
  var energy = 0, pulse = 0;
  var mood = 0, targetMood = 0;
  var light = 0, targetLight = 0;
  var time = Math.random() * 40;
  var running = !reduceMotion;
  var lastUserMove = 0;
  var rafId = 0, lastTs = 0;

  function readTheme() {
    var prefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
    targetLight = prefersLight ? 1 : 0;
    document.documentElement.setAttribute('data-theme', prefersLight ? 'light' : 'dark');
    if (reduceMotion) { light = targetLight; drawFrame(); }
  }
  readTheme();
  if (window.matchMedia) {
    var mq = window.matchMedia('(prefers-color-scheme: light)');
    if (mq.addEventListener) mq.addEventListener('change', readTheme);
    else if (mq.addListener) mq.addListener(readTheme);
  }

  function resize() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var w = Math.max(1, Math.round(stage.clientWidth * dpr));
    var h = Math.max(1, Math.round(stage.clientHeight * dpr));
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width = w; canvas.height = h;
      gl.viewport(0, 0, w, h);
    }
  }
  if (window.ResizeObserver) {
    new ResizeObserver(function () { resize(); if (reduceMotion || !running) drawFrame(); }).observe(stage);
  }
  window.addEventListener('resize', resize);
  resize();

  function toField(ev) {
    var rect = stage.getBoundingClientRect();
    var w = rect.width, h = rect.height, m = Math.min(w, h);
    return {
      x: (ev.clientX - rect.left - w / 2) / m,
      y: -(ev.clientY - rect.top - h / 2) / m
    };
  }

  stage.addEventListener('pointermove', function (ev) {
    var p = toField(ev);
    var dx = p.x - pointer.tx, dy = p.y - pointer.ty;
    pointer.tx = p.x; pointer.ty = p.y;
    energy = Math.min(energy + Math.sqrt(dx * dx + dy * dy) * 3.2 + 0.03, 1.6);
    lastUserMove = performance.now();
    if (reduceMotion) { pointer.x = p.x; pointer.y = p.y; drawFrame(); }
  });
  stage.addEventListener('pointerdown', function (ev) {
    var p = toField(ev);
    pointer.tx = p.x; pointer.ty = p.y;
    if (reduceMotion) { pointer.x = p.x; pointer.y = p.y; }
    pulse = 1;
    energy = Math.min(energy + 0.35, 1.6);
    lastUserMove = performance.now();
    if (reduceMotion) drawFrame();
  });

  segBtns.forEach(function (btn) {
    btn.addEventListener('click', function () {
      var i = parseInt(btn.getAttribute('data-mood'), 10);
      targetMood = i;
      segBtns.forEach(function (b) { b.setAttribute('aria-pressed', b === btn ? 'true' : 'false'); });
      updateStatus();
      if (reduceMotion) { mood = i; drawFrame(); }
    });
  });

  function updateStatus() {
    var state = reduceMotion ? 'Still' : (running ? 'Live' : 'Paused');
    stateOut.textContent = MOODS[targetMood] + ' · ' + state;
  }

  pauseBtn.addEventListener('click', function () {
    running = !running;
    iconPause.style.display = running ? 'block' : 'none';
    iconPlay.style.display = running ? 'none' : 'block';
    pauseBtn.setAttribute('aria-label', running ? 'Pause animation' : 'Resume animation');
    updateStatus();
    if (running) { lastTs = 0; rafId = requestAnimationFrame(tick); }
    else if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
  });

  function drawFrame() {
    gl.uniform2f(U.uRes, canvas.width, canvas.height);
    gl.uniform1f(U.uTime, time);
    gl.uniform2f(U.uPointer, pointer.x, pointer.y);
    gl.uniform1f(U.uEnergy, energy);
    gl.uniform1f(U.uPulse, pulse);
    gl.uniform1f(U.uMood, mood);
    gl.uniform1f(U.uLight, light);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }

  function tick(ts) {
    if (!running) return;
    if (!lastTs) lastTs = ts;
    var dt = Math.min((ts - lastTs) / 1000, 0.05);
    lastTs = ts;
    time += dt * 0.55;

    // autonomous drift keeps the field alive when the pointer rests
    if (ts - lastUserMove > 3000) {
      pointer.tx = 0.42 * Math.cos(time * 0.9);
      pointer.ty = 0.30 * Math.sin(time * 1.27);
      energy = Math.max(energy, 0.35);
    }

    var k = 1 - Math.pow(0.0015, dt); // smoothing, framerate independent
    pointer.x += (pointer.tx - pointer.x) * k;
    pointer.y += (pointer.ty - pointer.y) * k;
    mood += (targetMood - mood) * (1 - Math.pow(0.01, dt));
    light += (targetLight - light) * (1 - Math.pow(0.01, dt));
    energy *= Math.pow(0.12, dt);
    pulse *= Math.pow(0.05, dt);

    drawFrame();
    rafId = requestAnimationFrame(tick);
  }

  document.addEventListener('visibilitychange', function () {
    if (reduceMotion) return;
    if (document.hidden && rafId) { cancelAnimationFrame(rafId); rafId = 0; }
    else if (!document.hidden && running && !rafId) { lastTs = 0; rafId = requestAnimationFrame(tick); }
  });

  updateStatus();
  if (reduceMotion) { drawFrame(); }
  else { rafId = requestAnimationFrame(tick); }
})();
</script>
</body>
</html>
